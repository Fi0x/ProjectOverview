<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Felix Pechtl Sailing</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/gallery.css">
    <link rel="stylesheet" href="../../css/slideshow.css">
</head>
<body>
<div id="gallery">
    <h1>Gallery</h1>
    <!--TODO: Fix arrows and image sizes-->

    <!-- Slideshow container -->
    <div id="slideshow-container" class="slideshow-container">

        <!-- Full-width images with number and caption text -->
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="../../images/sailing/scholtz2.jpg" style="width:100%">
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="../../images/sailing/scholtz1.jpeg" style="width:100%">
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="../../images/sailing/pogo1250.jpg" style="width:100%">
        </div>

        <!-- Next and previous buttons -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
</div>
<script>
    let slideIndex = 1;
    let slides;

    loadImages();
    showSlides(slideIndex);

    // Next/previous controls
    function plusSlides(n) {
        showSlides(slideIndex += n);
    }

    function showSlides(n) {
        let i;
        if (n > slides.length) {
            slideIndex = 1
        }
        if (n < 1) {
            slideIndex = slides.length
        }
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }
        slides[slideIndex - 1].style.display = "block";
    }

    function loadImages() {
        let slideshowContainer = document.getElementById("slideshow-container");
        let images;//TODO: Load all images filenames in sailing folder

        for (let sailingImage in images) {
            addImage(slideshowContainer, sailingImage);
        }

        slides = document.getElementsByClassName("mySlides");
    }

    function addImage(slideshowContainer, imageFile, totalImages, index) {
        let div = document.createElement("div");
        div.classList.add("mySlides", "fade");

        let countDiv = document.createElement("div");
        countDiv.classList.add("numbertext");
        countDiv.innerText = "" + index + " / " + totalImages;
        div.appendChild(countDiv);

        let img = document.createElement("img");
        img.src = imageFile;
        img.classList.add("galleryImg")
        div.appendChild(img);

        slideshowContainer.appendChild(div);
    }
</script>
</body>
